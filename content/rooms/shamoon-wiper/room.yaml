slug: shamoon-wiper
title: "Shamoon and RasGas: The Wiper"
summary: >-
  In August 2012 a wiper called Shamoon destroyed the data on tens of thousands
  of Saudi Aramco workstations and struck RasGas days later. No centrifuge, no
  breaker, just erasure at scale, and a hard lesson in how an IT-side wiper
  becomes an energy-sector crisis. Research the incident, the malware, and the
  recovery.
