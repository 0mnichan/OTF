web_lab:
  scenario: blackout-2015
  briefing: >-
    You are on the substation control LAN (10.20.0.50), on a seat whose
    credentials were reused from the corporate VPN - exactly as in 2015. Feeder
    RTU rtu-sub7.grid is at 10.20.0.10. Read engineer_notes.txt, find the breaker
    coil, and open it. Type 'help'.
