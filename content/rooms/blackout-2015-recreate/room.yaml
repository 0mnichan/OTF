title: "Blackout 2015: Recreate"
summary: >-
  December 2015, Ukraine: the first confirmed cyberattack to take down a power
  grid. Research how the attackers did it, then reproduce the decisive act - open
  a distribution breaker over the control network from a stolen operator seat -
  against a simulated feeder RTU in your browser console.
